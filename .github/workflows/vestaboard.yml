name: Vestaboard
run-name: Vestaboard - ${{ github.event_name }}

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Show trigger
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "Time (UTC): $(date -u)"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Check Telegram updates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          LAST_TELEGRAM_UPDATE_ID: ${{ vars.LAST_TELEGRAM_UPDATE_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          node --input-type=module <<'EOF'
          import { execFileSync } from "node:child_process";
          import { readFileSync, writeFileSync } from "node:fs";
          import {
          canFitQuote,
          cleanQuote,
          FALLBACK_QUOTES,
          } from "./data/quotes.js";

          const lastUpdateId =
            Number(process.env.LAST_TELEGRAM_UPDATE_ID) || 0;

          const offset = lastUpdateId + 1;

          const response = await fetch(
            `https://api.telegram.org/bot${process.env.TELEGRAM_BOT_TOKEN}/getUpdates?offset=${offset}`
          );

          const data = await response.json();

          if (!data.ok) {
            throw new Error(
              `Telegram request failed: ${data.description}`
            );
          }

          const updates = data.result ?? [];

          console.log(
            `New Telegram updates found: ${updates.length}`
          );

          const allowedChatId = 397818738;
          const quotesFile = "data/telegram-quotes.json";

          let telegramQuotes;

          try {
            telegramQuotes = JSON.parse(
              readFileSync(quotesFile, "utf8")
            );

            if (!Array.isArray(telegramQuotes)) {
              telegramQuotes = [];
            }
          } catch {
            telegramQuotes = [];
          }
          const existingCleanQuotes = new Set(
            [
              ...FALLBACK_QUOTES,
              ...telegramQuotes,
            ].map((quote) => cleanQuote(quote))
          );


          for (const update of updates) {
            const message =
              update.message ??
              update.edited_message;

            if (!message) {
              continue;
            }

            if (message.chat.id !== allowedChatId) {
              console.log(
                `Ignored unauthorised chat: ${message.chat.id}`
              );
              continue;
            }

            const text = message.text?.trim();

            if (!text) {
              console.log(
                `Ignored non-text update: ${update.update_id}`
              );
              continue;
            }
            const cleanedText = cleanQuote(text);

            if (!canFitQuote(text)) {
              console.log({
                updateId: update.update_id,
                status: "rejected - does not fit",
                text,
              });

              continue;
            }

            if (existingCleanQuotes.has(cleanedText)) {
              console.log({
                updateId: update.update_id,
                status: "rejected - duplicate",
                text,
              });

              continue;
            }
            console.log({
              updateId: update.update_id,
              status: "authorised quote candidate",
              text,
            });
          }

          if (updates.length > 0) {
            const newestUpdateId =
              updates[updates.length - 1].update_id;

            execFileSync(
              "gh",
              [
                "variable",
                "set",
                "LAST_TELEGRAM_UPDATE_ID",
                "--body",
                String(newestUpdateId),
                "--repo",
                process.env.GITHUB_REPOSITORY,
              ],
              {
                stdio: "inherit",
                env: process.env,
              }
            );

            console.log(
              `Saved Telegram update ID: ${newestUpdateId}`
            );
          }
          EOF

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Send Tesla dashboard to Vestaboard
        run: npm start
        env:
          VESTABOARD_TOKEN: ${{ secrets.VESTABOARD_TOKEN }}
          TESLA_CLIENT_ID: ${{ secrets.TESLA_CLIENT_ID }}
          TESLA_CLIENT_SECRET: ${{ secrets.TESLA_CLIENT_SECRET }}
          TESLA_REFRESH_TOKEN: ${{ secrets.TESLA_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          LAST_BETTY_RANGE_MILES: ${{ vars.LAST_BETTY_RANGE_MILES }}

      - name: Save replacement Tesla refresh token
        if: ${{ success() && hashFiles('tesla-refresh-token.txt') != '' }}
        run: |
          gh secret set TESLA_REFRESH_TOKEN \
            --repo "$GITHUB_REPOSITORY" \
            --body "$(cat tesla-refresh-token.txt)"
          rm -f tesla-refresh-token.txt
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
